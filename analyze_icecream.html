    const regex = /M[^MZ]*Z/gi;
    const subPaths = [];
    let m;
    while ((m = regex.exec(fullD)) !== null) subPaths.push(m[0]);

    const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7DC6F'];
    const names = [
      'Subpath 1 (biggest outline)',
      'Subpath 2 (bottom-left)',
      'Subpath 3 (bottom-right)',
      'Subpath 4 (tiny mid)',
      'Subpath 5 (tiny mid)',
      'Subpath 6 (tiny upper mid)',
      'Subpath 7 (tiny dot)',
      'Subpath 8 (upper-left)'
    ];

    const container = document.getElementById('subpaths');
    subPaths.forEach((d, i) => {
      // Analyze coords
      const xCoords = [...d.matchAll(/[MLCQSTAHV]\s*(-?[\d.]+)/gi)].map(m => parseFloat(m[1]));
      const yCoords = [...d.matchAll(/[MLCQSTV]\s*-?[\d.]+\s*,?\s*(-?[\d.]+)/gi)].map(m => parseFloat(m[1]));
      const minX = Math.min(...xCoords), maxX = Math.max(...xCoords);
      const minY = Math.min(...yCoords), maxY = Math.max(...yCoords);

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${names[i]}</h3>
        <svg class="subpath" viewBox="0 0 130 128">
          <path d="${d}" fill="${colors[i]}" stroke="#333" stroke-width="0.5"/>
        </svg>
        <div class="info">
          X: ${minX.toFixed(2)} - ${maxX.toFixed(2)} (w:${(maxX-minX).toFixed(2)})<br>
          Y: ${minY.toFixed(2)} - ${maxY.toFixed(2)} (h:${(maxY-minY).toFixed(2)})<br>
          % X: ${(minX/130*100).toFixed(1)}% - ${(maxX/130*100).toFixed(1)}%<br>
          % Y: ${(minY/128*100).toFixed(1)}% - ${(maxY/128*100).toFixed(1)}%
        </div>
        <pre>${d.substring(0,200)}${d.length>200?'...':''}</pre>
      `;
      container.appendChild(card);
    });
  </script>
