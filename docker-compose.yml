services:
  postgres:
    image: postgres:16-alpine
    container_name: e-card-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecard
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: ecard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
